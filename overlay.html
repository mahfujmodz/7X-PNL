<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#eee;font:13px Arial,sans-serif}body{padding:2px}.panel{width:100%;max-height:455px;border-radius:15px;overflow:hidden;background:#0d0d0f;border:1px solid #145b25;box-shadow:0 14px 42px #000b}.top{padding:11px;text-align:center;font-weight:800;font-size:14px;letter-spacing:.5px;color:white;background:linear-gradient(110deg,#075d17,#12b92b,#064b14);touch-action:none;user-select:none}.scroll{padding:6px 10px 8px;max-height:370px;overflow:auto}.section{margin:2px 0 8px;padding:7px;text-align:center;font-size:12px;background:linear-gradient(90deg,#170d1b,#650b7c,#170d1b);color:#f4dafa}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px;font-size:12px;color:#e7e7e7}.row input[type=checkbox]{width:20px;height:20px;accent-color:#19e83b}.row input[type=range]{width:105px;accent-color:#18e63b}.val{color:#6dff83;min-width:25px;text-align:right}select{background:#171017;color:#eee;border:1px solid #5c176c;padding:5px}.note{font-size:10px;line-height:1.4;color:#aaa;text-align:center}.close{width:100%;border:0;padding:11px;background:#163b1b;color:#baffc0;font-weight:800;letter-spacing:1px}
</style></head><body><div class="panel"><div id="drag" class="top">HEX BLADE · FLOATING PANEL</div><div class="scroll">
<div class="section">Active Menu</div><label class="row">Enable Functions <input type="checkbox"></label>
<div class="section">Display Settings</div><label class="row">Glitch Fire <input type="range" min="0" max="100" value="0" data-out="glitch"></label><label class="row">Value <span id="glitch" class="val">0</span></label>
<div class="section">Controller · UI preview only</div><label class="row">Silent Aim (visual demo) <input type="checkbox"></label><label class="row">Speed Hack Risk (visual demo) <input type="checkbox"></label><label class="row">Headshot Rate <input type="range" min="0" max="100" value="0" data-out="head"></label><label class="row">Value <span id="head" class="val">0%</span></label><label class="row">Aim FOV <input type="range" min="0" max="100" value="0" data-out="fov"></label><label class="row">Value <span id="fov" class="val">0</span></label>
<div class="section">Extra</div><label class="row">Show FOV circle <input type="checkbox"></label><label class="row">Ignore knockdown (demo) <input type="checkbox"></label><label class="row">Ignore Bot (demo) <input type="checkbox"></label><label class="row">No Recoil (demo) <input type="checkbox"></label>
<div class="section">ESP · visual controls only</div><label class="row">Draw Line <input type="checkbox"></label><label class="row">Draw Box <input type="checkbox"></label><label class="row">Draw Health <input type="checkbox"></label><label class="row">Draw Name <input type="checkbox"></label><label class="row">Draw Distance <input type="checkbox"></label><p class="note">Floating UI preview only. These controls do not modify other apps or games.</p></div><button class="close" onclick="AndroidOverlay.closeOverlay()">CLOSE</button></div><script>document.querySelectorAll('input[type=range]').forEach(e=>e.addEventListener('input',()=>{let o=document.getElementById(e.dataset.out);if(o)o.textContent=e.value+(e.dataset.out==='head'?'%':'')}));</script></body></html>
