<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020a04">
<title>HEX BLADE — Actions</title>
<style>
:root{--bg:#020904;--panel:#06170a;--green:#12ff24;--green2:#00bd18;--text:#e7ffe9;--muted:#82a987;--line:#159c27;--bad:#ff5d68}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Arial,sans-serif}
body{min-height:100vh;min-height:100svh;overflow-x:hidden}
button,input{font:inherit}
button{cursor:pointer}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:0}
.page{position:relative;z-index:1;min-height:100vh;min-height:100svh}
.hidden{display:none!important}
.center{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px 18px}
.login-card{width:min(100%,515px);padding:34px 34px 28px;border:1px solid #19b52b;border-radius:24px;background:rgba(4,18,8,.94);box-shadow:0 0 22px #00ff2411,inset 0 0 24px #00ff2407;animation:cardGlow 4s ease-in-out infinite}
.brand{font-size:clamp(27px,7vw,36px);font-weight:800;letter-spacing:5px;text-align:center;text-shadow:0 0 18px #dfffff77;margin:0}
.tagline{text-align:center;color:var(--green);font-size:12px;font-weight:800;letter-spacing:7px;margin:8px 0 22px}
.rule{height:1px;background:linear-gradient(90deg,transparent,#16451c,transparent);margin:0 0 21px}
.subtitle{text-align:center;color:#91a795;font-size:13px;margin:0 0 28px}
.field-label{display:block;color:var(--green);font-size:12px;font-weight:700;margin:0 0 8px 16px}
.field{display:flex;align-items:center;gap:8px;border:1px solid #167b24;border-radius:14px;background:#061509;padding:0 12px;height:62px;box-shadow:inset 0 0 12px #00ff2406}
.field:focus-within{border-color:var(--green);box-shadow:0 0 0 3px #00ff2414}
.field input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:#edffef;font-size:14px;letter-spacing:1px}
.field input::placeholder{color:#174e20}
.icon-btn{border:0;background:transparent;color:var(--green);font-size:23px;padding:5px}
.primary{width:100%;height:62px;margin-top:27px;border:1px solid #48ff4d;border-radius:15px;background:linear-gradient(100deg,#00ff12,#00d20c 75%,#00b90b);color:#001e04;font-size:15px;font-weight:850;letter-spacing:2px;box-shadow:0 0 0 4px #00ff2410,0 0 18px #00ff2420}
.primary:active{transform:scale(.99)}.primary:disabled{opacity:.65;cursor:wait}
.status{min-height:20px;text-align:center;margin:18px 0 0;font:12px ui-monospace,monospace;letter-spacing:2px;color:var(--green)}
.status.error{color:var(--bad);letter-spacing:.4px}.status.success{color:var(--green)}
.version{text-align:center;margin-top:12px;color:#57815d;font-size:11px;letter-spacing:1px}
.home{width:min(100% - 28px,900px);margin:auto;padding:24px 0 35px}
.topbar{display:flex;align-items:center;gap:12px;padding:13px 0 19px;border-bottom:1px solid #17401e;margin-bottom:22px}
.smallbrand{font-weight:850;letter-spacing:2px;margin-right:auto}.smallbrand span{color:var(--green)}
.pill{font:10px ui-monospace,monospace;color:var(--green);border:1px solid #176b25;border-radius:8px;padding:8px}
.outline-btn{border:1px solid #21752c;border-radius:9px;background:#07170a;color:#baffc0;padding:9px 12px;font-size:12px}
.hero,.tile{border:1px solid #176d25;border-radius:18px;background:rgba(4,20,8,.93);padding:22px;box-shadow:0 0 18px #00ff2408}
.eyebrow{color:var(--green);font:11px ui-monospace,monospace;letter-spacing:2px}
.hero h2{font-size:clamp(25px,6vw,35px);margin:12px 0}.hero p,.tile p{color:#8eac93;font-size:13px;line-height:1.6}
.active{display:inline-block;color:var(--green);background:#06280c;border:1px solid #176b25;border-radius:8px;padding:8px 10px;font:11px ui-monospace,monospace}
.section-title{font-size:17px;margin:25px 0 13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.tile{padding:18px;min-height:135px}.tile .emoji{font-size:24px}.tile h3{font-size:15px;margin:12px 0 7px}.tile p{font-size:12px;margin:0}
.footer{text-align:center;color:#49724e;font:10px ui-monospace,monospace;letter-spacing:2px;padding:28px 0 8px}
.loading-wrap{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px 18px;background:rgba(0,5,1,.88)}
.loading-card{width:min(100%,510px);padding:35px 26px 30px;border:2px solid var(--green);border-radius:27px;background:#06180b;box-shadow:0 0 28px #00ff2414;text-align:center}
.loading-card h2{color:var(--green);font-size:27px;letter-spacing:2px;margin:0 0 30px}
.spinner{width:72px;height:72px;margin:0 auto 40px;border:8px solid #103817;border-top-color:var(--green);border-right-color:var(--green);border-radius:50%;animation:spin .9s linear infinite}
.progress-track{height:14px;border-radius:99px;background:#0d2a12;overflow:hidden;margin:0 0 20px}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#00ff24,#00b918);border-radius:99px;box-shadow:0 0 15px #00ff2466;transition:width .16s linear}
.percent{font-size:24px;font-weight:850;color:var(--green);margin:0 0 10px}
.loading-note{font-size:12px;color:#9bb49e;margin:0}
.toast{position:fixed;z-index:8;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;padding:12px 16px;border:1px solid #236c2c;border-radius:12px;background:#102015;color:#eaffec;font-size:12px;box-shadow:0 10px 30px #0008;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes cardGlow{0%,100%{box-shadow:0 0 15px #00ff2409}50%{box-shadow:0 0 25px #00ff241b}}
@media(max-width:480px){.login-card{padding:30px 20px 25px}.tagline{letter-spacing:5px}.grid{grid-template-columns:1fr}.home{padding-top:15px}.loading-card{padding:32px 22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.actions-page{position:relative;min-height:100vh;min-height:100svh;background:#000b03;padding:10px 26px calc(124px + env(safe-area-inset-bottom));color:#18ff24}
.actions-title{font-size:16px;font-weight:800;margin:0 0 21px 8px;color:#18ff24;text-shadow:0 0 8px #00ff2433}
.start-cheat{display:block;width:100%;height:100px;border:0;border-radius:22px;background:#08f20b;color:#001503;font-size:23px;font-weight:800;box-shadow:0 0 8px #00ff241c}
.start-cheat:active{transform:scale(.995);filter:brightness(.92)}
.actions-content{min-height:calc(100svh - 34px - env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.cheat-result{position:fixed;z-index:20;top:8px;left:50%;transform:translateX(-50%);display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.cheat-result.dragging{cursor:grabbing}
.cheat-logo{display:block;width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #16ff65;box-shadow:0 0 18px #00ff2466;pointer-events:none}
@media(max-width:480px){.actions-content{min-height:calc(100svh - 34px - env(safe-area-inset-bottom))}.cheat-logo{width:60px;height:60px}}
.bottom-nav{position:fixed;z-index:5;left:0;right:0;bottom:0;min-height:124px;padding:16px 8px calc(18px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;align-items:center;background:#07190b;border-top:1px solid #0a210e}
.nav-item{width:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;color:#536357;font-size:14px;padding:8px}
.nav-item.selected{color:#18ff24}
.nav-icon{font-size:34px;line-height:1;font-weight:500}
.nav-icon.gear{font-size:32px}
@media(max-width:480px){.actions-page{padding-left:26px;padding-right:26px}.start-cheat{height:100px}}

/* Purple SAFE-style settings panel (visual demo only) */
.safe-modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:7vh 12px 12px;background:radial-gradient(ellipse at center,#0009,#000b);color:#eee;font-family:Arial,sans-serif}
.safe-modal.hidden{display:none!important}.safe-panel{position:relative;width:min(230px,76vw);max-height:min(50vh,400px);display:flex;flex-direction:column;overflow:hidden;border-radius:15px;background:#0d0d0f;box-shadow:0 14px 42px #000b;border:1px solid #145b25;z-index:2}
.safe-top{background:linear-gradient(110deg,#075d17,#12b92b,#064b14);padding:8px;text-align:center;font-weight:800;font-size:14px;letter-spacing:.4px;color:#fff;cursor:move;touch-action:none;user-select:none;-webkit-user-select:none}
.safe-scroll{padding:5px 10px 8px;overflow-y:auto;overscroll-behavior:contain}.safe-section{margin:1px 0 8px;padding:7px;text-align:center;font-size:12px;background:linear-gradient(90deg,#170d1b,#650b7c,#170d1b);color:#f4dafa}
.safe-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:37px;font-size:12px;color:#e7e7e7}.safe-row input[type=checkbox]{appearance:none;width:22px;height:22px;border:3px solid #777;border-radius:3px;background:#111;flex:none}.safe-row input[type=checkbox]:checked{border-color:#16e640;background:#0b9b28;box-shadow:inset 0 0 0 4px #111}.safe-range{width:70%;accent-color:#13d735}.safe-value{color:#ddd}.safe-close{border:0;background:#08751b;color:white;padding:9px;text-align:center;font-size:12px;cursor:pointer}.safe-note{font-size:10px;color:#aaa;text-align:center;padding:7px}

</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<main class="page">
  <section id="loginPage" class="center">
    <div class="login-card">
      <h1 class="brand">HEX BLADE</h1>
      <div class="tagline">- SECURE LOGIN -</div>
      <div class="rule"></div>
      <p class="subtitle">Enter your license key to start session</p>
      <form id="loginForm">
        <label class="field-label" for="licenseKey">License Key</label>
        <div class="field">
          <input id="licenseKey" name="licenseKey" type="text" placeholder="Enter license key" autocomplete="off" maxlength="32" required>
          <button class="icon-btn" id="copyBtn" type="button" aria-label="Copy entered license key" title="Copy key">▢</button>
        </div>
        <button class="primary" id="authBtn" type="submit">AUTHENTICATE</button>
        <p id="status" class="status" aria-live="polite"></p>
      </form>
      <div class="version">V2.0 · HEX BLADE</div>
    </div>
  </section>

  <section id="loadingPage" class="loading-wrap hidden" aria-live="polite">
    <div class="loading-card">
      <h2>Loading</h2>
      <div class="spinner" aria-hidden="true"></div>
      <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
      <p id="percent" class="percent">0%</p>
      <p id="loadingNote" class="loading-note">Loading Resources...!</p>
    </div>
  </section>

/* Animated green rain canvas */
(() => {
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  let w = 0, h = 0, drops = [], raf = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.max(30, Math.floor(w / 8));
    drops = Array.from({length: count}, () => ({x:Math.random()*w,y:Math.random()*h,len:8+Math.random()*28,speed:2+Math.random()*5,alpha:.18+Math.random()*.65}));
  }
  function draw() {
    ctx.clearRect(0,0,w,h);
    for (const d of drops) {
      ctx.strokeStyle = `rgba(22,255,42,${d.alpha})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-2,d.y+d.len); ctx.stroke();
      d.y += d.speed; d.x -= .45;
      if (d.y > h+35 || d.x < -10) { d.x=Math.random()*w+10; d.y=-d.len-Math.random()*h*.2; }
    }
    raf = requestAnimationFrame(draw);
  }
  window.addEventListener('resize', resize);
  resize(); draw();
  document.addEventListener('visibilitychange', () => { if(document.hidden) cancelAnimationFrame(raf); else draw(); });
})();

const loginPage = document.getElementById('loginPage');
const loadingPage = document.getElementById('loadingPage');
const homePage = document.getElementById('homePage');
const form = document.getElementById('loginForm');
const keyInput = document.getElementById('licenseKey');
const authBtn = document.getElementById('authBtn');
const statusEl = document.getElementById('status');
const toast = document.getElementById('toast');
const progressFill = document.getElementById('progressFill');
const percentEl = document.getElementById('percent');
const loadingNote = document.getElementById('loadingNote');
let currentPage = 'login', loadingTimer = null, toastTimer = null, lastBackAt = 0, progress = 0;

function showToast(message) {
  toast.textContent = message; toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}
function setPage(page, push=true) {
  currentPage = page;
  loginPage.classList.toggle('hidden', page !== 'login');
  loadingPage.classList.toggle('hidden', page !== 'loading');
  homePage.classList.toggle('hidden', page !== 'home');
  if (push) history.pushState({page}, '', '#' + page);
  window.scrollTo(0,0);
}
function runLoading() {
  setPage('loading');
  progress = 0; progressFill.style.width = '0%'; percentEl.textContent = '0%';
  loadingNote.textContent = 'Loading Resources...!';
  clearInterval(loadingTimer);
  loadingTimer = setInterval(() => {
    progress = Math.min(100, progress + Math.ceil(Math.random()*5));
    progressFill.style.width = progress + '%';
    percentEl.textContent = progress + '%';
    if (progress >= 32) loadingNote.textContent = 'Loading Resources...!';
    if (progress >= 68) loadingNote.textContent = 'Preparing Dashboard...!';
    if (progress >= 92) loadingNote.textContent = 'Finalizing Session...!';
    if (progress >= 100) {
      clearInterval(loadingTimer); loadingTimer = null;
      setTimeout(() => { setPage('home'); showToast('License verified!'); }, 350);
    }
  }, 100);
}
document.getElementById('copyBtn').addEventListener('click', async () => {
  const value = keyInput.value;
  if (!value) { showToast('Please enter license key'); return; }
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(value);
    else {
      keyInput.select();
      const ok = document.execCommand('copy');
      if (!ok) throw new Error('Copy unavailable');
    }
    showToast('License key copied');
  } catch { showToast('Could not copy key on this browser'); }
});
form.addEventListener('submit', async event => {
  event.preventDefault();
  const key = keyInput.value.trim();
  if (!key) { statusEl.className='status error'; statusEl.textContent='Please enter license key'; return; }
  authBtn.disabled = true;
  statusEl.className='status';
  statusEl.textContent='VERIFYING LICENSE...';
  try {
    // License documents are created by the separate admin panel in licenseKeys/{licenseKey}.
    const licenseSnap = await getDoc(doc(db, 'licenseKeys', key));
    if (!licenseSnap.exists()) {
      statusEl.className='status error';
      statusEl.textContent='Invalid license key. Try again.';
      return;
    }
    const license = licenseSnap.data();
    if (String(license.status || '').toLowerCase() !== 'active') {
      statusEl.className='status error';
      statusEl.textContent='This license is inactive.';
      return;
    }
    let expiresAt = license.expiresAt;
    if (expiresAt && typeof expiresAt.toMillis === 'function') expiresAt = expiresAt.toMillis();
    else if (expiresAt && typeof expiresAt === 'object' && 'seconds' in expiresAt) expiresAt = expiresAt.seconds * 1000;
    else if (expiresAt !== null && expiresAt !== undefined) expiresAt = Number(expiresAt);
    if (expiresAt && Number.isFinite(expiresAt) && expiresAt <= Date.now()) {
      statusEl.className='status error';
      statusEl.textContent='This license has expired.';
      return;
    }
    statusEl.className='status success';
    statusEl.textContent='✓ LOGIN SUCCESSFUL';
    runLoading();
  } catch (error) {
    console.error('License verification failed:', error);
    statusEl.className='status error';
    statusEl.textContent = error.code === 'permission-denied'
      ? 'License verification blocked by Firestore rules.'
      : 'Could not verify license. Check internet and try again.';
  } finally {
    authBtn.disabled = false;
  }
});
document.getElementById('startCheatBtn').addEventListener('click', () => {
  if (window.AndroidOverlay && typeof window.AndroidOverlay.requestOverlay === 'function') {
    window.AndroidOverlay.requestOverlay();
    showToast('Opening Android overlay permission…');
  } else {
    showToast('Open this panel in the HEX BLADE Android app to enable floating overlay.');

});

safeModal.querySelectorAll('input[type="range"]').forEach(el => el.addEventListener('input', () => {
  const out = document.getElementById(el.dataset.value);
  if (out) out.textContent = el.value + (el.dataset.suffix || (el.dataset.value === 'headVal' ? '%' : ''));
}));
// Show a green FOV circle only while Show Fov is enabled; Aim Fov controls its size.
const showFovToggle = document.getElementById('showFovToggle');
const aimFovRange = document.getElementById('aimFovRange');
const fovCircle = document.getElementById('fovCircle');
function updateFovCircle() {
  const enabled = showFovToggle.checked;
  fovCircle.style.display = enabled ? 'block' : 'none';
  const diameter = 40 + Number(aimFovRange.value) * 2.2;
  fovCircle.style.width = diameter + 'px';
  fovCircle.style.height = diameter + 'px';
}
showFovToggle.addEventListener('change', updateFovCircle);
aimFovRange.addEventListener('input', updateFovCircle);
updateFovCircle();

// Drag the floating logo with a finger or mouse.
(() => {
  const logo = document.getElementById('cheatResult');
  let dragging = false, startX = 0, startY = 0, originX = 0, originY = 0;
  logo.addEventListener('pointerdown', e => {
    if (logo.classList.contains('hidden')) return;
    dragging = true; logo.classList.add('dragging');
    const r = logo.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY; originX = r.left; originY = r.top;
    logo.style.left = originX + 'px'; logo.style.top = originY + 'px';
    logo.style.transform = 'none';
    try { logo.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  });
  logo.addEventListener('pointermove', e => {
    if (!dragging) return;
    const r = logo.getBoundingClientRect();
    const x = Math.max(0, Math.min(window.innerWidth - r.width, originX + e.clientX - startX));
    const y = Math.max(0, Math.min(window.innerHeight - r.height, originY + e.clientY - startY));
    logo.style.left = x + 'px'; logo.style.top = y + 'px';
  });
  const stop = () => { dragging = false; logo.classList.remove('dragging'); };
  logo.addEventListener('pointerup', stop);
  logo.addEventListener('pointercancel', stop);
})();
document.getElementById('logoutBtn')?.addEventListener('click', () => {
  clearInterval(loadingTimer); loadingTimer=null;
  keyInput.value=''; statusEl.textContent=''; authBtn.disabled=false;
  setPage('login'); showToast('Logged out');
});
/* Android/browser Back: home -> login; loading -> login; on login, show a safe hint. */
history.replaceState({page:'login'}, '', location.pathname + location.search + '#login');
window.addEventListener('popstate', () => {
  if (currentPage === 'home') { setPage('login', false); showToast('Back to login'); history.pushState({page:'login'}, '', '#login'); }
  else if (currentPage === 'loading') {
    clearInterval(loadingTimer); loadingTimer=null; setPage('login', false); authBtn.disabled=false;
    showToast('Loading cancelled'); history.pushState({page:'login'}, '', '#login');
  } else {
    const now = Date.now();
    if (now-lastBackAt < 2000) showToast('Use your browser controls to close this page');
    else { lastBackAt=now; showToast('Press Back again to leave this page'); }
    history.pushState({page:'login'}, '', '#login');
  }
});
